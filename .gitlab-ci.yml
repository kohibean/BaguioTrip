# =====================================================================
#  Baguio Trip Planner — GitLab CI/CD
#  Stages: install -> quality -> build (image) -> deploy (Pages)
# =====================================================================

stages:
  - install
  - quality
  - build
  - deploy

# Reusable Node image + npm cache keyed on the lockfile
.node:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull

# ---------------------------------------------------------------------
# 1) INSTALL — populate the npm cache once, share it downstream
# ---------------------------------------------------------------------
install:
  extends: .node
  stage: install
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ---------------------------------------------------------------------
# 2) QUALITY — lint + unit tests run in parallel
# ---------------------------------------------------------------------
lint:
  extends: .node
  stage: quality
  needs: ["install"]
  script:
    - npm run lint

test:
  extends: .node
  stage: quality
  needs: ["install"]
  script:
    - npm run test
  # Surface a JUnit report in the GitLab UI if you later add a reporter
  artifacts:
    when: always
    expire_in: 1 week

# ---------------------------------------------------------------------
# 3) BUILD — build the production bundle, then the Docker image,
#    and push it to GitLab's built-in Container Registry.
#    Uses Docker-in-Docker.
# ---------------------------------------------------------------------
build:image:
  stage: build
  needs: ["lint", "test"]
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------
# 4) DEPLOY — publish the static PWA to GitLab Pages (free hosting).
#    GitLab Pages serves whatever lands in the `public/` artifact.
# ---------------------------------------------------------------------
pages:
  extends: .node
  stage: deploy
  needs: ["build:image"]
  script:
    # Build fresh, then expose dist/ as the Pages "public" dir.
    # PUBLIC_BASE makes asset URLs resolve under the project subpath
    # (e.g. https://<user>.gitlab.io/baguio-trip/). $CI_PROJECT_NAME
    # is provided automatically by GitLab.
    - export PUBLIC_BASE="/$CI_PROJECT_NAME/"
    - npm run build
    - rm -rf .public_out
    - mv dist .public_out
    - mv .public_out public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
