name: Build & Deploy

# Run on every push to main, and allow manual runs from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-progress one for the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- Quality: lint + unit tests ----------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  # ---- Build the static PWA ----------------------------------------
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # PUBLIC_BASE makes asset URLs resolve under the repo subpath
      # (https://<user>.github.io/<repo>/). github.event.repository.name
      # is the repo name, provided automatically.
      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/
      # SPA fallback: copy index.html to 404.html so deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---- Deploy to GitHub Pages --------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4